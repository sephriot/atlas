[package]
name = "atlas"
version = "0.5.0"
edition = "2021"
description = "CLI knowledge and memory manager for coding agents"
license = "MIT"

[dependencies]
serde_json = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.33"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
thiserror = "2"
log = "0.4"
